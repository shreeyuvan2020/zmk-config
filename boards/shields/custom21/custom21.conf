# Wireless
CONFIG_ZMK_BLE=y

# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILTIN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# I2C + GPIO expander + bit-banged secondary I2C for the OLED
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_GPIO_PCF857X=y
CONFIG_I2C_GPIO=y

# Make sure the PCF8574 GPIO controller comes up before the bit-banged I2C
# bus that depends on it. If init still fails with -ENODEV on the OLED bus,
# raise this number further.
CONFIG_GPIO_PCF857X_INIT_PRIORITY=55
