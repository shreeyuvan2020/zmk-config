# Wireless
CONFIG_ZMK_BLE=y

# OLED status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# I2C + PCF8574 + bit-banged secondary I2C for the OLED
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_GPIO_PCF8574=y
CONFIG_I2C_GPIO=y

# PCF8574 has to come up before the bit-banged i2c bus that depends on it.
# If init fails with -ENODEV, raise this further (60, 65, 75).
CONFIG_GPIO_PCF8574_INIT_PRIORITY=55
